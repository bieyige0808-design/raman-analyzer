name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "raman_gui.py"
      - "raman_batch.py"
      - "chart_textbox.py"
      - "requirements.txt"
      - "RamanAnalyzer.spec"
      - "assets/**"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Check Python files
        run: python -m py_compile raman_gui.py raman_batch.py chart_textbox.py

      - name: Build application
        run: pyinstaller --clean --noconfirm RamanAnalyzer.spec

      - name: Add examples and documentation
        shell: pwsh
        run: |
          Copy-Item -Recurse examples dist/RamanAnalyzer-v1.3/examples
          Copy-Item README.md dist/RamanAnalyzer-v1.3/README.md
          Copy-Item LICENSE dist/RamanAnalyzer-v1.3/LICENSE

      - name: Verify package
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/RamanAnalyzer-v1.3/RamanAnalyzer-v1.3.exe")) {
            throw "RamanAnalyzer-v1.3.exe was not created."
          }
          if (-not (Test-Path "dist/RamanAnalyzer-v1.3/examples/synthetic_data/synthetic_01.txt")) {
            throw "Synthetic example data were not included."
          }
          if (-not (Test-Path "dist/RamanAnalyzer-v1.3/_internal/assets/raman-analyzer.ico")) {
            throw "Application icon was not included."
          }
          if (-not (Test-Path "dist/RamanAnalyzer-v1.3/_internal/assets/raman-analyzer-icon.png")) {
            throw "Window icon was not included."
          }
          foreach ($size in 32, 48, 256) {
            if (-not (Test-Path "dist/RamanAnalyzer-v1.3/_internal/assets/raman-analyzer-icon-$size.png")) {
              throw "Window icon size $size was not included."
            }
          }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: RamanAnalyzer-Windows-v1.3
          path: dist/RamanAnalyzer-v1.3
          if-no-files-found: error
          retention-days: 30
